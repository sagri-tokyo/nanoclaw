name: pr-dependencies

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A merged dependency fires no event on the blocked PR, so its check stays
  # red until re-run. The working re-run is the check's "Re-run" button, which
  # replays the pull_request context; workflow_dispatch is a manual entrypoint
  # for the auto-revalidation sweep tracked in sagri-tokyo/sagri-ai#404.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # PR_DEP_TOKEN needs read access to every repo a Depends-On may point at.
      # The built-in GITHUB_TOKEN only sees this repo, so cross-repo private
      # reads fail without it. Fail fast rather than silently pass.
      - name: Block on unmerged cross-repo dependencies
        env:
          GH_TOKEN: ${{ secrets.PR_DEP_TOKEN }}
          BODY: ${{ github.event.pull_request.body }}
          # Only same-org dependencies are resolvable. Querying an arbitrary
          # owner/repo would turn the check summary into an oracle for private
          # repo existence and merge-state via the token.
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          urls=$(printf '%s' "$BODY" \
            | grep -oiE '(Depends-On|Blocked by)[: ][[:space:]]*https://github\.com/[^/]+/[^/]+/pull/[0-9]+' \
            | grep -oiE 'https://github\.com/[^/]+/[^/]+/pull/[0-9]+' || true)
          [ -z "$urls" ] && exit 0
          blocked=0
          echo "| dependency | state |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for url in $urls; do
            path=${url#https://github.com/}
            slug=${path%/pull/*}
            number=${url##*/}
            owner=${slug%/*}
            if [ "$owner" != "$ORG" ]; then
              state="UNSUPPORTED (outside $ORG)"
            else
              state=$(gh pr view "$number" --repo "$slug" --json state -q '.state' 2>/dev/null || echo "UNRESOLVED")
            fi
            echo "| $url | $state |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$state" != "MERGED" ]; then
              echo "::error::blocked by $url (state: $state)"
              blocked=1
            fi
          done
          exit $blocked
